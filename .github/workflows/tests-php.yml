# yaml-language-server: $schema=https://json.schemastore.org/github-workflow

name: PHP Tests

on: # yamllint disable-line rule:truthy
  workflow_dispatch:
  pull_request:
    paths:
      - '**/*.php'
      - 'src/**'
      - 'tests/php/**'
      - 'tests/bootstrap.php'
      - 'tests/wp-tests-config.php'
      - 'composer.json'
      - 'package.json'
      - 'package-lock.json'
      - 'phpunit.xml.dist'
      - '.wp-env.test.json'
      - '.github/workflows/tests-php.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-php:
    name: PHPUnit - WP ${{ matrix.core || 'latest' }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1']
        core: ['WordPress/WordPress#6.7', null]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: 'package.json'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      # The block is registered from build/, which is not versioned.
      - name: Build plugin assets
        run: npm run build

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # Production requirements only: dev tools are resolved for the simulated
      # platform (config.platform.php) and some need a newer PHP than the plugin.
      - name: Check production platform requirements
        run: composer check-platform-reqs --no-dev

      - name: Launch test environment
        env:
          WP_ENV_PHP_VERSION: ${{ matrix.php }}
          WP_ENV_CORE: ${{ matrix.core }}
        run: npm run env:start-ci

      - name: Run PHPUnit
        run: npm run test:php

      - name: Stop test environment
        if: always()
        continue-on-error: true
        run: npm run env:stop-tests

  coverage:
    name: PHPUnit coverage
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: 'package.json'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build plugin assets
        run: npm run build

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Launch coverage environment
        env:
          WP_ENV_PHP_VERSION: '8.1'
        run: npm run env:start-tests

      - name: Run PHPUnit with coverage
        run: npm run test:php -- --coverage-html=coverage/ --coverage-text

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: phpunit-coverage
          path: coverage
          if-no-files-found: warn

      - name: Stop coverage environment
        if: always()
        continue-on-error: true
        run: npm run env:stop-tests
